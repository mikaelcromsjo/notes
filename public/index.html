<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anandas's Notes</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#4f6df5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Notes" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="header-toggle-btn" class="header-toggle-btn" title="Hide header" aria-label="Hide header" aria-pressed="false">▲</button>

  <header class="topbar">
    <h1></h1>
    <div class="search" style="margin-left: 10px;">
      <input type="text" id="search-input" placeholder="Jump to note…" autocomplete="off" />
      <div id="search-results" class="search-results hidden"></div>
    </div>
    <button id="new-note-btn">+ New note</button>
    <div class="header-controls">
      <div class="zoom-controls">
        <button id="zoom-out-btn" class="icon-btn" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zoom-reset-btn" class="icon-btn zoom-level" title="Reset zoom">100%</button>
        <button id="zoom-in-btn" class="icon-btn" title="Zoom in" aria-label="Zoom in">+</button>
      </div>
      <button id="depth-cycle-btn" class="icon-btn" title="Nested grid depth" aria-label="Cycle nested grid depth">🔲</button>
      <button id="color-mode-btn" class="icon-btn" title="Colour coding: off" aria-label="Cycle colour coding">🎨</button>
      <button id="map-btn" class="icon-btn" title="Map of notes" aria-label="Open map of notes">🗺️</button>
      <button id="agenda-btn" class="icon-btn" title="Agenda — what's due" aria-label="Open agenda">🔔<span id="agenda-badge" class="agenda-badge hidden"></span></button>
      <button id="insights-btn" class="icon-btn" title="Insights" aria-label="Open insights">📊</button>
      <button id="history-btn" class="icon-btn" title="History &amp; undo" aria-label="Open history">↩️</button>
      <button id="fullscreen-btn" class="icon-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
      <button id="account-btn" class="icon-btn" title="Account" aria-label="Account">👤</button>
    </div>
  </header>

  <nav id="tabbar" class="tabbar"></nav>
  <nav id="pinbar" class="tabbar pinbar hidden"></nav>
  <nav id="alarmbar" class="tabbar alarmbar hidden"></nav>

  <main id="grid" class="grid">
    <!-- 9 cells: index 4 is the center note, others are neighbors -->
  </main>

  <div id="note-overlay" class="overlay hidden">
    <div class="note-fullscreen">
      <button id="note-overlay-close" class="note-fullscreen-close" title="Close" aria-label="Close">✕</button>
      <div id="note-overlay-body" class="note-fullscreen-body"></div>
    </div>
  </div>

  <div id="picker-overlay" class="overlay hidden">
    <div class="picker">
      <h2>Create a note</h2>

      <div class="picker-style-row" id="picker-style-row">
        <button type="button" class="picker-style-btn active" data-style="text">📝 Text</button>
        <button type="button" class="picker-style-btn" data-style="image">📷 Photo</button>
        <button type="button" class="picker-style-btn" data-style="audio">🎤 Audio</button>
        <button type="button" class="picker-style-btn" data-style="contact">👤 Contact</button>
        <button type="button" class="picker-style-btn" data-style="app">🔗 App link</button>
      </div>

      <input type="text" id="picker-new-title" placeholder="New note title…" />

      <input type="file" id="picker-photo-input" class="hidden" accept="image/*" capture="environment" />

      <div id="picker-audio-row" class="hidden picker-field-row">
        <button type="button" id="picker-record-btn">🎤 Start recording</button>
        <span id="picker-record-status" class="picker-hint"></span>
      </div>

      <div id="picker-contact-row" class="hidden picker-field-column">
        <input type="text" id="picker-contact-name" placeholder="Contact name" />
        <input type="text" id="picker-contact-phone" placeholder="Phone (optional)" />
        <input type="text" id="picker-contact-email" placeholder="Email (optional)" />
        <button type="button" id="picker-contact-pick-btn" class="hidden secondary">Pick from phone contacts</button>
      </div>

      <input type="text" id="picker-app-uri" class="hidden" placeholder="App link (intent://… or https://…)" />

      <div id="picker-connect-section">
        <div class="picker-divider">or connect note</div>
        <input type="text" id="picker-search" placeholder="Search existing notes…" autocomplete="off" />
        <div id="picker-results" class="picker-results"></div>
      </div>

      <div class="picker-actions">
        <button id="picker-create-btn">Create &amp; connect</button>
        <button id="picker-cancel-btn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="map-overlay" class="overlay hidden">
    <div class="map-fullscreen">
      <button id="map-overlay-close" class="note-fullscreen-close" title="Close" aria-label="Close">✕</button>
      <div id="map-status" class="map-status"></div>
      <div class="map-modes" id="map-modes">
        <button data-mode="off">Plain</button>
        <button data-mode="note">Heat</button>
        <button data-mode="cluster">Clusters</button>
      </div>
      <div id="map"></div>
    </div>
  </div>

  <div id="insights-overlay" class="overlay hidden">
    <div class="picker insights-panel">
      <button id="insights-close" class="note-fullscreen-close" title="Close" aria-label="Close">✕</button>
      <h2>Insights</h2>
      <div id="insights-body" class="insights-body"></div>
    </div>
  </div>

  <div id="agenda-overlay" class="overlay hidden">
    <div class="note-fullscreen agenda-panel">
      <button id="agenda-close" class="note-fullscreen-close" title="Close" aria-label="Close">✕</button>
      <h2>Agenda</h2>
      <div id="agenda-body" class="agenda-body"></div>
    </div>
  </div>

  <div id="history-overlay" class="overlay hidden">
    <div class="note-fullscreen history-panel">
      <button id="history-close" class="note-fullscreen-close" title="Close" aria-label="Close">✕</button>
      <h2>History</h2>
      <div id="history-body" class="history-body"></div>
    </div>
  </div>

  <div id="login-overlay" class="overlay hidden">
    <div class="picker">
      <h2>Sign in</h2>
      <p class="picker-hint" style="margin: 0 0 0.6rem;">Enter your email and we'll send you a login link. No password.</p>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      <div id="login-error" class="picker-hint" style="color: var(--danger);"></div>
      <div class="picker-actions">
        <button id="login-btn">Email me a link</button>
      </div>
    </div>
  </div>

  <div id="alarm-overlay" class="overlay hidden">
    <div class="picker alarm-editor">
      <h2>Alarm</h2>
      <input type="time" id="alarm-time-input" class="alarm-time-input" />
      <div class="alarm-repeat-label">Repeat</div>
      <div class="alarm-days-row" id="alarm-days-row"></div>
      <div id="alarm-date-wrap">
        <div class="picker-divider">one-time on</div>
        <input type="date" id="alarm-date-input" />
      </div>
      <div class="picker-actions">
        <button id="alarm-save-btn">Save</button>
        <button id="alarm-remove-btn" class="secondary hidden">Remove</button>
        <button id="alarm-cancel-btn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="alarm-popup-overlay" class="overlay hidden">
    <div class="picker alarm-popup">
      <h2>⏰ Alarm</h2>
      <div id="alarm-popup-list"></div>
    </div>
  </div>

  <div id="account-overlay" class="overlay hidden">
    <div class="picker">
      <h2>Account</h2>
      <p class="picker-hint" id="account-email" style="margin: 0 0 0.8rem;"></p>
      <label class="picker-hint" for="account-widget-url">Home-screen widget feed URL</label>
      <input type="text" id="account-widget-url" readonly />
      <div class="picker-actions">
        <button id="account-copy-btn" class="secondary">Copy URL</button>
        <button id="account-reset-widget-btn" class="secondary">Reset widget URL</button>
      </div>
      <div class="picker-divider">or</div>
      <div class="picker-actions">
        <button id="account-switch-btn" class="secondary">Sign in as someone else</button>
        <button id="account-close-btn" class="secondary">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
