plugins {
    id("com.android.application")
}

android {
    namespace "se.iaai.notes"
    compileSdk 34

    defaultConfig {
        applicationId "se.iaai.notes"
        minSdk 26
        targetSdk 34
        // Bump both on every release meant for existing installs to pick up —
        // UpdateChecker compares versionCode against downloads/notes-version.json,
        // which must be regenerated to match (see notes-android/CLAUDE.md).
        versionCode 3
        versionName "0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Intentionally no AndroidX / Jetpack deps — plain framework APIs only,
    // keeps the dependency graph (and first-build download) tiny.
}
