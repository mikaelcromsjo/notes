plugins {
    id("com.android.application")
}

android {
    namespace "se.iaai.notes"
    compileSdk 34

    defaultConfig {
        applicationId "se.iaai.notes"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Intentionally no AndroidX / Jetpack deps — plain framework APIs only,
    // keeps the dependency graph (and first-build download) tiny.
}
